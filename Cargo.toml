[package]
name = "ytm-native"
version = "0.1.8"
description = "A native YouTube Music client for Windows"
# rustypipe is GPL-3.0, so the app is too.
license = "GPL-3.0-only"
repository = "https://github.com/Visxoz/ytm-native"
edition = "2024"
publish = false

[build-dependencies]
slint-build = "1.18.1"
winresource = "0.1.34"

[dependencies]
cpal = "0.18.2"
discord-rich-presence = "1.1.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "webp"] }
log = "0.4.34"
oxc_allocator = "0.155"
oxc_ast = "0.155"
oxc_ast_visit = "0.155"
oxc_parser = "0.155"
oxc_semantic = "0.155"
oxc_span = "0.155"
raw-window-handle = "0.6.2"
# gzip and brotli are already in the tree through rustypipe; they let the
# player endpoint and the player script answer compressed.
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "native-tls-alpn", "http2", "blocking", "gzip", "brotli"] }
rquickjs = "0.9"
rustypipe = { version = "=0.11.4", features = ["userdata"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sha1 = "0.10"
sha2 = "0.10"
slint = { version = "1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-skia", "accessibility", "compat-1-2", "raw-window-handle-06", "unstable-winit-030"] }
souvlaki = "0.8.3"
symphonia = { version = "0.6.1", default-features = false, features = ["mkv", "isomp4", "aac"] }
time = { version = "0.3.55", features = ["local-offset"] }
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
unsafe-libopus = "0.2.0"
url = "2.5"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_Security_Cryptography"] }
wry = { version = "0.57", default-features = false }

[dev-dependencies]
http = "1.5"

[profile.release]
# Small by default; the crates on the audio and drawing paths keep full speed.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package.unsafe-libopus]
opt-level = 3

[profile.release.package.symphonia-codec-aac]
opt-level = 3

[profile.release.package.i-slint-renderer-software]
opt-level = 3

[profile.release.package.zune-jpeg]
opt-level = 3

# Artwork decoding and scaling.
[profile.release.package.image]
opt-level = 3

[profile.release.package.image-webp]
opt-level = 3

# Every page is a large JSON response.
[profile.release.package.serde_json]
opt-level = 3

# QuickJS, which unscrambles each Premium stream's URL.
[profile.release.package.rquickjs-sys]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2

# The translated libopus relies on wrapping arithmetic, as C does.
[profile.dev.package.unsafe-libopus]
overflow-checks = false

# CI's lint and tests: quickest to build, as nothing there needs speed.
[profile.ci]
inherits = "dev"
debug = false

[profile.ci.package."*"]
opt-level = 0

[profile.ci.package.unsafe-libopus]
overflow-checks = false

# Crates with patches/<crate>.patch applied; scripts/vendor-patched.ps1 makes
# them. Slint maps the fallback fonts instead of reading them into memory, and
# its Skia renderer draws fonts from those mappings instead of private copies;
# rustypipe opens the signed-in user's own playlists.
[patch.crates-io]
i-slint-common = { path = "vendor/i-slint-common" }
i-slint-renderer-skia = { path = "vendor/i-slint-renderer-skia" }
rustypipe = { path = "vendor/rustypipe" }
