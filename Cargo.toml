[package]
name = "ytm-native"
version = "0.1.1"
description = "A native YouTube Music client for Windows"
edition = "2024"
publish = false

[build-dependencies]
slint-build = "1.18.1"
winresource = "0.1.34"

[dependencies]
cpal = "0.18.2"
discord-rich-presence = "1.1.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "webp"] }
log = "0.4.34"
oxc_allocator = "0.155"
oxc_ast = "0.155"
oxc_ast_visit = "0.155"
oxc_parser = "0.155"
oxc_semantic = "0.155"
oxc_span = "0.155"
raw-window-handle = "0.6.2"
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "native-tls-alpn", "http2", "blocking"] }
rquickjs = "0.9"
rustypipe = { version = "=0.11.4", features = ["userdata"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
slint = { version = "1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-skia", "accessibility", "compat-1-2", "raw-window-handle-06"] }
souvlaki = "0.8.3"
symphonia = { version = "0.6.1", default-features = false, features = ["mkv", "isomp4", "aac"] }
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
unsafe-libopus = "0.2.0"
url = "2.5"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_System_SystemInformation"] }

[profile.release]
# Small by default; the crates on the audio and drawing paths keep full speed.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package.unsafe-libopus]
opt-level = 3

[profile.release.package.symphonia-codec-aac]
opt-level = 3

[profile.release.package.i-slint-renderer-software]
opt-level = 3

[profile.release.package.zune-jpeg]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2

# The translated libopus relies on wrapping arithmetic, as C does.
[profile.dev.package.unsafe-libopus]
overflow-checks = false

# Crates with patches/<crate>.patch applied; scripts/vendor-patched.ps1 makes
# them. Slint maps the fallback fonts instead of reading them into memory, and
# its Skia renderer draws fonts from those mappings instead of private copies;
# rustypipe opens the signed-in user's own playlists.
[patch.crates-io]
i-slint-common = { path = "vendor/i-slint-common" }
i-slint-renderer-skia = { path = "vendor/i-slint-renderer-skia" }
rustypipe = { path = "vendor/rustypipe" }
