[package]
name = "ytm-native"
version = "0.1.0"
description = "A native YouTube Music client for Windows"
edition = "2024"
publish = false

[build-dependencies]
slint-build = "1.18.1"
winresource = "0.1.34"

[dependencies]
cpal = "0.18.2"
discord-rich-presence = "1.1.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
log = "0.4.34"
opus-decoder = "0.1.1"
raw-window-handle = "0.6.2"
reqwest = { version = "0.13.5", features = ["blocking"] }
rustypipe = { version = "0.11.4", features = ["userdata"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
slint = { version = "1.18.1", features = ["raw-window-handle-06"] }
souvlaki = "0.8.3"
symphonia = { version = "0.6.1", default-features = false, features = ["mkv", "isomp4", "aac"] }
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
url = "2.5"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Security"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

# opus-decoder relies on wrapping shifts, as libopus does.
[profile.dev.package.opus-decoder]
overflow-checks = false
