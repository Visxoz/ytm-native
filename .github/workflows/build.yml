name: Build

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: ./.github/actions/patched-crates

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Patched crates rebuild when patches change, so save afresh then.
          key: ${{ hashFiles('patches/*.patch', 'scripts/vendor-patched.ps1') }}

      - name: Build
        run: cargo build --release --locked

      # Inno Setup builds the installer into dist/, beside the portable exe.
      - name: Build installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'could not install Inno Setup' }
          }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          & $iscc /Qp "/DAppVersion=$version" installer/ytm-native.iss
          if ($LASTEXITCODE -ne 0) { throw 'the installer did not build' }
          Copy-Item target/release/ytm-native.exe dist/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ytm-native-${{ github.sha }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
