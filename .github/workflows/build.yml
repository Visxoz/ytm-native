name: Build

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build exe
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: ./.github/actions/patched-crates

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Saved from main only, as a tag's cache is never read by the next
          # tag; a build run on demand on main warms the next release's.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        # Built into the exe; without them Last.fm scrobbling is hidden.
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: cargo build --release --locked

      # Inno Setup builds the installer into dist/, beside the portable exe.
      - name: Build installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'could not install Inno Setup' }
          }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          & $iscc /Qp "/DAppVersion=$version" installer/ytm-native.iss
          if ($LASTEXITCODE -ne 0) { throw 'the installer did not build' }
          Copy-Item target/release/ytm-native.exe dist/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ytm-native-${{ github.sha }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
