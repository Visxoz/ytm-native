name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    name: Check tag matches version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare tag with Cargo.toml
        run: |
          # Read directly: cargo would need the vendored crates first.
          version=$(grep -m 1 '^version = ' Cargo.toml | cut -d '"' -f 2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  check:
    needs: version
    uses: ./.github/workflows/check.yml

  build:
    needs: check
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ytm-native-${{ github.sha }}
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          mv dist/ytm-native.exe "dist/ytm-native_${version}_x64-portable.exe"
          previous=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -n 1 || true)
          if [ -n "$previous" ]; then
            notes=(--generate-notes --notes-start-tag "$previous")
          else
            notes=(--notes "First release of ytm-native, a native YouTube Music client for Windows.")
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "ytm-native v$version" "${notes[@]}" \
            dist/*.exe
