name: Check

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Lint and test run side by side, each on the light `ci` profile.
jobs:
  lint:
    name: Format and lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Format
        run: cargo fmt --check

      - uses: ./.github/actions/patched-crates

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Patched crates rebuild when patches change, so save afresh then.
          key: ${{ hashFiles('patches/*.patch', 'scripts/vendor-patched.ps1') }}

      - name: Clippy
        run: cargo clippy --profile ci --all-targets --locked -- -D warnings

  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: ./.github/actions/patched-crates

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Patched crates rebuild when patches change, so save afresh then.
          key: ${{ hashFiles('patches/*.patch', 'scripts/vendor-patched.ps1') }}

      - name: Test
        run: cargo test --profile ci --locked
