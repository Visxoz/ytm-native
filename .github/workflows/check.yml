name: Check

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Lint and test run side by side, each on the light `ci` profile. Caches are
# saved from main only: one saved for a tag or pull request can be read by
# nothing else, and would only push main's out of the 10 GB limit.
jobs:
  lint:
    name: Format and lint
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Format
        run: cargo fmt --check

      - uses: ./.github/actions/patched-crates

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --profile ci --all-targets --locked -- -D warnings

  test:
    name: Test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: ./.github/actions/patched-crates

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The canary builds the same tests, so it reads this cache.
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test
        run: cargo test --profile ci --locked
