name: CI

on:
  push:
    branches: [main]
    # Docs-only changes have nothing to check.
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only pull requests: a cancelled build on main never saves its cache.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  build:
    needs: check
    # The exe is built for release tags (release.yml); here only on demand.
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build.yml
    # For the Last.fm keys built into the exe.
    secrets: inherit
