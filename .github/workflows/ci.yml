name: CI

on:
  push:
    branches: [main]
    # Docs-only changes have nothing to check.
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only pull requests: a cancelled build on main never saves its cache.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  # Built alongside the checks on main, so each commit has an exe to try and
  # the release build's cache stays warm for the next tag, which can only
  # read main's caches.
  build:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build.yml
