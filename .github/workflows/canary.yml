name: Canary

# Asks YouTube daily whether every stream path still works: each plain-URL
# client, the bytes it serves, and trimming the current player for Premium.
# A failure opens an issue, so a change on YouTube's side is known the day
# it happens; the app keeps playing through the next client meanwhile.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: always

jobs:
  canary:
    name: Resolve a stream through every path
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: ./.github/actions/patched-crates

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ hashFiles('patches/*.patch', 'scripts/vendor-patched.ps1') }}

      - name: Ask YouTube
        run: cargo test --profile ci --locked canary -- --ignored --nocapture

      - name: Open an issue
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Canary: a stream path stopped working"
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="The daily check against YouTube failed. The log names the client or the player step that broke: $run"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Still failing: $run"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
