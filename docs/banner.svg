<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <title>ytm-native: YouTube Music, as a real Windows app</title>
  <defs>
    <radialGradient id="glow" cx="80%" cy="58%" r="58%">
      <stop offset="0" stop-color="#ff0033" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#ff0033" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ff0033" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="6%" cy="0%" r="50%">
      <stop offset="0" stop-color="#7a1fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7a1fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff0033"/>
      <stop offset="1" stop-color="#ff6b86"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffc2cd"/>
    </linearGradient>
    <style>
      .eq { transform-box: fill-box; transform-origin: 50% 100%; animation: eq 1.6s ease-in-out infinite alternate; }
      .e2 { animation-duration: 1.1s; animation-delay: -0.4s; }
      .e3 { animation-duration: 1.9s; animation-delay: -0.9s; }
      .e4 { animation-duration: 1.3s; animation-delay: -0.2s; }
      .e5 { animation-duration: 1.7s; animation-delay: -1.1s; }
      .e6 { animation-duration: 1.2s; animation-delay: -0.7s; }
      .e7 { animation-duration: 1.5s; animation-delay: -0.5s; }
      @keyframes eq { from { transform: scaleY(1); } to { transform: scaleY(0.45); } }
      @media (prefers-reduced-motion: reduce) { .eq { animation: none; } }
      text { font-family: 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, Inter, 'Helvetica Neue', Arial, sans-serif; }
      .pill { fill: #ffffff; fill-opacity: 0.07; stroke: #ffffff; stroke-opacity: 0.14; }
      .pt { font-size: 17px; font-weight: 600; fill: #e8e8ec; }
    </style>
  </defs>

  <rect width="1280" height="400" rx="28" fill="#0c0c0f"/>
  <rect width="1280" height="400" rx="28" fill="url(#glow)"/>
  <rect width="1280" height="400" rx="28" fill="url(#glow2)"/>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <text x="86" y="150" font-size="88" font-weight="700" letter-spacing="-2" fill="url(#title)">ytm-native</text>
  <text x="90" y="202" font-size="30" font-weight="600" fill="#f0f0f3">YouTube Music, as a real Windows app.</text>
  <text x="90" y="240" font-size="19" fill="#9a9aa3">Native Rust, drawn on the GPU. No browser, no Electron, just music.</text>

  <g>
    <rect class="pill" x="90" y="282" width="226" height="40" rx="20"/>
    <text class="pt" x="203" y="308" text-anchor="middle">256 kbps with Premium</text>
    <rect class="pill" x="328" y="282" width="210" height="40" rx="20"/>
    <text class="pt" x="433" y="308" text-anchor="middle">Gapless &amp; crossfade</text>
    <rect class="pill" x="550" y="282" width="164" height="40" rx="20"/>
    <text class="pt" x="632" y="308" text-anchor="middle">Synced lyrics</text>
    <rect class="pill" x="726" y="282" width="166" height="40" rx="20"/>
    <text class="pt" x="809" y="308" text-anchor="middle">41 MB minimised</text>
  </g>

  <!-- The equaliser the app shows beside the playing song. -->
  <g fill="url(#bar)">
    <rect class="eq" x="912" y="160" width="26" height="110" rx="13"/>
    <rect class="eq e2" x="954" y="108" width="26" height="162" rx="13"/>
    <rect class="eq e3" x="996" y="72" width="26" height="198" rx="13"/>
    <rect class="eq e4" x="1038" y="130" width="26" height="140" rx="13"/>
    <rect class="eq e5" x="1080" y="94" width="26" height="176" rx="13"/>
    <rect class="eq e6" x="1122" y="148" width="26" height="122" rx="13"/>
    <rect class="eq e7" x="1164" y="186" width="26" height="84" rx="13"/>
  </g>
  <g fill="#ff0033" opacity="0.16">
    <rect x="912" y="282" width="26" height="40" rx="13"/>
    <rect x="954" y="282" width="26" height="58" rx="13"/>
    <rect x="996" y="282" width="26" height="72" rx="13"/>
    <rect x="1038" y="282" width="26" height="50" rx="13"/>
    <rect x="1080" y="282" width="26" height="64" rx="13"/>
    <rect x="1122" y="282" width="26" height="44" rx="13"/>
    <rect x="1164" y="282" width="26" height="30" rx="13"/>
  </g>
</svg>
