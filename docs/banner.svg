  <rect width="1280" height="360" rx="28" fill="url(#glow2)"/>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <g font-family="'Segoe UI Variable Display','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif">
    <text x="88" y="160" font-size="88" font-weight="700" letter-spacing="-2" fill="url(#fade)">ytm-native</text>
    <text x="92" y="212" font-size="28" font-weight="500" fill="#e6e6ea">YouTube Music, as a real Windows app.</text>
    <text x="92" y="256" font-size="20" fill="#9a9aa3">Fast · Light · Native · 256 kbps with Premium</text>
  </g>

