<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
  <defs>
    <radialGradient id="glow" cx="78%" cy="55%" r="55%">
      <stop offset="0" stop-color="#ff0033" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#ff0033" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ff0033" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="8%" cy="0%" r="45%">
      <stop offset="0" stop-color="#7a1fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7a1fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff0033"/>
      <stop offset="1" stop-color="#ff5c7a"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffc2cd"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" rx="28" fill="#0c0c0f"/>
